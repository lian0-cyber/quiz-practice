______。", "a": "HVIL", "o": []}, {"c": "客户服务-直服", "t": "填空题", "q": "电气灭火禁止使用______灭火器。", "a": "泡沫", "o": []}, {"c": "客户服务-直服", "t": "填空题", "q": "集成式热管理系统单车成本预计降低______元。", "a": "7500", "o": []}, {"c": "客户服务-直服", "t": "填空题", "q": "-10℃~0℃区间，集成式热管理使续驶里程提升______%。", "a": "4.8", "o": []}, {"c": "客户服务-直服", "t": "填空题", "q": "CT500 控制器整机重量≤______kg。", "a": "55", "o": []}, {"c": "客户服务-直服", "t": "填空题", "q": "高低压上下电时序要求：上电时先上______，再上高压电。", "a": "辅电（低压电）", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述 EV25 集成式热管理系统的五大收益。", "a": "（1）余热收益：电机电控水路小循环，直接给电池和驾驶室加热，占比 5%；（2）控制收益：整车热管理统一由 TMU 控制，控制更高效、系统更稳定，占比 5%；（3）节能收益：热泵技术相比 PTC 在各场景大幅节能，占比 45%；（4）空间重量收益：集成度高占用空间小，重量降低 15KG，占比 5%；（5）成本收益：单车成本预计降低 7500 元。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述集成式热管理系统相比分体式的优势。", "a": "（1）系统重量减轻约 15KG；（2）整车成本降低约 7000 元；（3）系统集成度高，乘员舱、电池、电驱三部分独立系统集成为三合一热管理；（4）零部件种类减少约 15 件（管路、支架等）；（5）系统能耗降低约 2%；（6）整车布置简洁紧凑，为上装预留更大空间，可覆盖多车型。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述 GC-BUS 软件读取故障码的步骤。", "a": "（1）打开 GC-BUS 软件，点击连接标识；（2）弹出连接页面，根据实车波特率修改连接设置，选择对应车型配置（纯电选 V0.5 纯电动）；（3）点击连接设备；（4）点击功能区故障码方块，选择当前故障，读取故障 SPN、FMI 及故障描述。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述电机绝缘故障的诊断步骤。", "a": "（1）断开整车高压，打开电机高压线盒盖，使用绝缘电阻表 1000VDC 档测量电机三相端子与机壳的绝缘电阻，初步确认；（2）拆卸电机三相线缆，再次使用绝缘电阻表 1000VDC 档测量电机三相端子与机壳的绝缘电阻；（3）当电机冷态绝缘电阻＜20MΩ，锁定电机绝缘故障。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述 TCU 通讯异常的排查步骤。", "a": "（1）ON 档电情况下，用万用表检查 TCU 低压插件端电源电压（18~30V 正常）和 CANH、CANL 电压（CANH 约 2.65V、CANL 约 2.45V 正常）；（2）若电压异常，排查线路找到线束故障点修复；（3）若电压正常，检查电控插座和低压线束插件是否卡扣损坏、针脚弯曲或退针；（4）若为插件问题更换插件或调件更换；若插件正常，判断为 TCU 内部通讯故障，更换 TCU。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述变速箱卡档故障的处理方法。", "a": "（1）拆掉换挡机构，手动拨回空挡；（2）检查变速箱内部是否发卡；（3）确认变速箱无异常后，安装新的换挡机构；（4）验证空挡位置和各档位换挡正常。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述坡度传感器的标定方法。", "a": "（1）车辆停在水平路面，不能上高压；（2）拉手刹，油门刹车同时踩满，保持 30S；（3）通过标定工具确认标定成功（标定成功第一个字节为 01）。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述取力不工作的排查步骤。", "a": "（1）检查取力器翘板开关是否卡滞；（2）检查取力器电磁阀是否正常工作（开关操作听动作声音）；（3）检查取力器内部是否卡滞：关闭开关，从输出接口拨动输出花键观察是否正常转动；（4）拆开换挡通气塞，检查换挡轴及弹簧是否正常回位，气室内是否生锈、冷凝水结冰。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述 CT500 多合一控制器的五大模块组成。", "a": "（1）MCU：驱动电机控制器，负责电机驱动控制；（2）HCM：高压配电控制单元，负责高压配电逻辑、互锁、预充等；（3）DC/DC：低压电源模块，高压转低压给车载设备供电和蓄电池充电；（4）SDC/AC：油泵电机控制器，驱动油泵电机；（5）BDC/AC：气泵电机控制器，驱动气泵电机。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述 CT500 故障排查的一般前提条件。", "a": "（1）控制器系统输入输出接插件、DCDC 输出接插件、低压信号接插件连接良好，无断裂退针；（2）PE 搭铁无松动，DCDC 输出接地搭铁无松动；（3）低压保险无损坏；（4）ON 档情况下整车能够正常上高压，若系统不能工作则考虑控制器故障。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述 HCM 高压环路互锁故障的排查流程。", "a": "（1）读取对应故障码，清除历史故障后重新上下电，确认是否复现；（2）整车 OFF 档下电，重新拔插所有高压接插件，检查互锁信号线针脚是否退针；（3）重新上电清除故障码，观察是否复现；（4）若复现，拆卸控制器检查内部 HCM 板互锁信号线插座插头和回路导通性；（5）必要时更换 HCM 板验证；若仍复现，排查车辆其他系统。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述 MCU 控制器 IGBT 过温报警的排查流程。", "a": "（1）检查水泵是否工作，冷却液液面是否在刻度线以上，循环是否顺畅；（2）若水泵不工作排查水泵原因，管路堵塞则疏通，液位低则加满冷却液；（3）故障未解决则拆卸控制器做内部检查；（4）更换电机控制板验证，若仍故障则更换电机驱动模块；（5）若均正常，排查车辆其他冷却系统原因。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述硬件过流故障的排查流程。", "a": "（1）读取故障码，清除历史后复现确认；（2）测量 UVW 三相绝缘阻抗，检查是否偏低或短路；（3）检查外部 UVW 线束是否破皮、短路、连接不良，检查负载电机绝缘；（4）若外部无异常，拆机检查内部线路、是否有导电异物；（5）更换电机控制板验证，必要时更换 IGBT 驱动模块；（6）仍故障则排查车辆其他关联系统。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述 DC/DC 输出短路故障的排查流程。", "a": "（1）读取故障码，清除历史后复现确认；（2）检查小电瓶是否欠压或短路；（3）检查 DCDC 输出线束是否短路，输出保险是否断路；（4）检查 DCDC 输出正负极端子是否短路；（5）若外围正常，拆机检查内部铜排、EMI 板是否短路烧熔；（6）必要时更换 DC/DC 模块验证；仍故障则排查其他系统。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述拆卸控制器前的安全准备工作。", "a": "（1）通过车辆启停开关或钥匙将整车下电，断开 MSD 和低压总闸；（2）等待至少 10 分钟，测量高压输入正负极电压降到 36V 以下；（3）佩戴绝缘手套等防护用品；（4）放置安全警示牌，确认无电后方可作业。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述整机拆卸与维修的过程步骤。", "a": "（1）准备工作：按安全要求断电放电，准备工具和防护用品；（2）拆除管线路：排出冷却液，拆下冷却水管、高压线束、电机线束、油泵气泵线束、DCDC 输出线束、低压信号接插件、搭铁线等；（3）拆除整机固定螺栓；（4）使用吊装设备将机器吊至安全区域，放置在工作台上；（5）完成拆卸状态，进行维修或更换；（6）安装为拆卸逆过程，按规定扭矩紧固，做好标记。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述保险拆卸与更换的注意事项。", "a": "（1）先断电放电，确保安全；（2）更换前先确认被保护部件无短路现象，防止二次损坏；（3）使用万用表判断保险通断，确认损坏后更换同规格保险；（4）按规定扭矩拧紧固定螺栓；（5）更换后可先做功能测试，确认正常后恢复盖板。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述高压配电控制板 HCM 的拆卸方法（熟练人员单独拆换）。", "a": "（1）分别取下高压互锁信号插头、继电器线圈插头、通讯控制插头；（2）取下高压正负线及螺栓、预充电阻线及螺栓；（3）取下高压控制 PCBA 板的固定螺栓，确认周边无干涉；（4）将靠近保险盒的铜排轻微抬起，PCB 板轻微抬起脱离定位孔，往电容旁移动至可轻松取出；（5）过程中注意静电防护和受力防护，防止损坏元器件。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述油泵驱动模块拆卸的注意事项。", "a": "（1）先拆卸底部盖板；（2）依次取下高压线、输出 UVW 线、温度传感器线、低压信号线；（3）取下 IGBT 固定螺栓和 PCBA 固定螺栓；（4）垂直向上轻力取出 PCBA，避免磕碰；（5）特别注意绝缘陶瓷片不能破损，安装时双面均需涂抹足量导热硅脂。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述 DC/DC 模块拆卸的注意事项。", "a": "（1）先拆卸底部盖板；（2）取下高压输入线、低压信号线；（3）拆下输出铜排 EMI 盖板、EMI 小板、输出正负极铜排；（4）取下 DC/DC 模块固定螺栓，从侧面凹槽单边轻抬起模块；（5）模块较重，注意拿取安全；安装时底部需涂抹足量导热硅脂保证导热。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述固件升级前的检查项目。", "a": "（1）电脑正常使用且电量充足；（2）CAN 设备功能正常，驱动安装正确；（3）CAN 总线装配外置 120Ω 终端电阻；（4）CANH 与 CANL 采用双绞线方式；（5）通讯转接接插件连接正确；（6）控制器供电电源电压正常；（7）上位机软件和固件程序包正确完整、匹配。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述 Megmeet Flash 软件刷写固件的步骤。", "a": "（1）启动 FLASH.SHELL 软件；（2）配置 CAN 设备类型、协议、波特率等参数；（3）导入固件程序压缩包所在文件夹；（4）勾选需要更新的程序，点击开始刷写；（5）等待刷写完成，核对软件版本确认升级成功。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述集成式热管理系统的劣势。", "a": "（1）售后维护不便：集成热管理机组置于驾驶室底层，售后维护存在不便；（2）开发工作量大：整车 VCU 通讯矩阵需做适应变化，开发调试工作量增加。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述 EV25 热管理 ADV 计划中的主要试验项目（至少 5 项）。", "a": "外观检测、制冷量测试、机组绝缘耐压测试、高低温性能试验、跌落测试、冲击测试、振动测试、阻燃测试、温湿度循环测试、热管理联合测试、实车路况测试、EMC 测试（任选 5 项即可）。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述电机端常见故障及原因。", "a": "（1）插针弯曲：暴力拔插旋变插头；（2）插头进水：没插紧或者插头损坏；（3）接线盒进水：密封圈没安装好；（4）三相线格兰头问题：没安装紧进水、屏蔽环损坏、不装屏蔽环导致干扰；以上故障均会导致报电机故障、温度异常或绝缘故障。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述变速箱漏油的常见部位。", "a": "（1）一轴油封漏油；（2）输出轴油封漏油；（3）取力器结合面漏油；多由螺栓脱落、密封圈切边等导致。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述车速信号无效的原因和影响。", "a": "原因：从线束进水、从插头进水；影响：报车速信号无效或者没有信号，车辆不升档或者限功率。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述 CT500 控制器的主要功能特点。", "a": "（1）高度集成，五合一设计，节省空间和成本；（2）支持 OTA 远程升级和 UDS 诊断；（3）完善的故障保护功能（过压、欠压、过流、过温、短路等）；（4）液冷冷却，适应恶劣工况；（5）IP68 防护等级，可靠性高；（6）支持 CAN 总线参数配置和标定。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述裸机冷态参考测量的内容和意义。", "a": "内容：低压信号端子对壳体电阻、高压端子对壳体电阻、高压端子对壳体耐压绝缘、高压端子之间阻抗及管压降。意义：作为故障排查时的参数对比基准，区分正常与异常状态。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "什么是高压互锁？其作用是什么？", "a": "高压互锁（HVIL）是通过监测高压回路中接插件的连接状态，形成回路信号的安全设计。作用：防止高压接插件带电插拔，在接插件松动或断开时及时切断高压，保护人身安全，避免拉弧损坏部件。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述 CAN 总线 BusOff 故障的原因和恢复方式。", "a": "原因：CAN 控制器发送错误计数器累计超过 255，通常由总线物理故障、干扰、节点故障等导致。恢复方式：总线恢复正常后，成功发送一帧报文即可自动恢复；或重启低压电复位控制器。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述旋变信号故障的可能原因。", "a": "（1）旋变绕组损坏，阻值异常；（2）旋变线束断路、短路或接触不良；（3）控制器旋变处理电路故障；（4）电机转子与转轴过盈配合松动，旋变位置偏移；（5）电磁干扰导致信号异常。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述堵转故障的触发条件和常见原因。", "a": "触发条件：运行状态下，转速低于 10RPM，电流持续超过阈值且达到设定时间。常见原因：电机输出轴机械卡死、车辆超重爬陡坡、轮子陷坑或爬台阶等负载过大场景。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述 DCDC 模块的核心功能。", "a": "将动力电池的高压直流电转换为低压直流电（27.5V），为车载低压用电设备供电，同时对辅助蓄电池充电，保障整车低压电力系统稳定运行，提升能效。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述 HCM 高压配电单元的核心功能。", "a": "负责高压接插件互锁检测、电压检测、高压预充控制、高压继电器输出控制，以及整机高压逻辑控制，是整车高压配电的控制核心。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述整车控制器 VCU 的核心作用。", "a": "VCU 是整车的控制核心，根据驾驶员操作和各子系统状态，进行整车能量管理、驱动扭矩控制、制动能量回收控制、故障诊断与处理、高压安全管理等，协调各系统工作，实现整车动力性、经济性和安全性。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述高压安全操作的 “断电 - 验电 - 放电” 流程。", "a": "（1）断电：关闭车辆电源，断开维修开关（MSD）和低压总闸；（2）验电：等待足够时间后，用电压表测量高压端子电压，确认低于安全电压（36V）；（3）放电：必要时通过放电装置对高压电容进行放电，确保无残留电压。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "为什么更换 IGBT 驱动模块时要涂抹导热硅脂？", "a": "导热硅脂可以填充模块与散热基板之间的微小间隙，降低接触热阻，保证 IGBT 工作时产生的热量高效传导到散热水道，避免过热损坏，保障模块可靠运行。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "为什么高压控制器要做 IP68 防护？", "a": "车辆运行环境复杂，可能面临扬尘、涉水、雨淋等场景，IP68 防护可以防止灰尘和水进入控制器内部，避免电气短路、腐蚀等故障，保证控制器在恶劣环境下可靠工作。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述集成式热管理系统节能收益的具体数据（至少 3 个温度点）。", "a": "（1）0℃制热：能耗降低 50.4%；（2）-5℃制热：能耗降低 43.2%；（3）-10℃制热：能耗降低 24.8%；（4）40℃制冷：能耗降低 1.4%；（5）-10~0℃续驶里程提升 4.8%。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述应雪供应商的主要参数情况。", "a": "压缩机制冷量 15KW@8KW，热泵驾驶舱 6KW，电池 PTC15KW，各水泵流量满足要求，重量 35KG，已完成整车匹配，供货周期 30D，8 月 5 日 SOP，适配自卸车、牵引车，报价 8848 元。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述故障码的五要素（以 MCU 为例）。", "a": "故障代码、故障名称、故障原因定义描述、故障恢复条件、故障处理维修建议。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "为什么上下电要遵循 “先上低压，后上高压；先断高压，后断低压” 的时序？", "a": "低压电是控制器的控制电源，先上低压可以让控制器先完成自检、初始化，再上高压避免冲击；下电时先断高压停止功率输出，再断低压保证控制器正常下电、数据保存，降低功率器件损坏风险。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述三相交流电机的 UVW 三相含义。", "a": "U、V、W 是三相交流电机的三个定子绕组端子，通入相位互差 120 度的三相交流电，产生旋转磁场，驱动电机转子转动，实现电能到机械能的转换。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "什么是预充？为什么要预充？", "a": "预充是高压上电时，先通过预充电阻给后端电容缓慢充电，当电压接近电池电压时再闭合主继电器的过程。原因：后端大容量电容初始电压为 0，直接闭合主继电器会产生巨大冲击电流，损坏继电器和电容，预充可以限制冲击电流，保护部件。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述温度传感器 NTC 的特性。", "a": "NTC 是负温度系数热敏电阻，电阻值随温度升高而降低，控制器通过测量电阻值换算出温度，用于过温保护、温度控制等。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述 EMC 测试的目的。", "a": "测试设备的电磁兼容性，包括电磁发射和电磁抗扰度，确保设备在电磁环境中正常工作，且不对其他设备和环境产生不可接受的电磁干扰，满足整车电磁兼容要求。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述集成式热管理系统中余热回收的原理。", "a": "电机电控工作时会产生热量，通过水路小循环将这部分废热收集起来，直接用于给电池加热和驾驶室采暖，不需要额外消耗电能加热，提升系统能效，降低能耗。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述 OTA 升级相比传统 CAN 刷写的优势。", "a": "（1）远程升级，无需到店接 CAN 线，节省时间和成本；（2）批量升级，可同时对多台车进行；（3）用户体验好，不影响车辆正常使用；（4）快速迭代修复问题、更新功能。", "o": []}, {"c": "客户服务-直服", "t": "简答题", "q": "简述新能源汽车热管理系统的重要性。", "a": "（1）保证电池在适宜温度工作，提升寿命和安全性；（2）保证电机、电控工作温度正常，提升效率和可靠性；（3）提供驾驶室采暖制冷，提升舒适性；（4）通过余热回收、热泵等技术降低能耗，提升续驶里程。", "o": []}];Q.forEach((x,i)=>x.id=i);
let st=JSON.parse(localStorage.quiz||'{}');st.w=st.w||{};st.done=st.done||{};
let curType='全部',list=[],idx=0,sel=new Set(),answered=false;
const types=['全部','单选题','多选题','判断题','填空题','简答题'];
function save(){localStorage.quiz=JSON.stringify(st)}
function build(){list=Q.filter(x=>(curType=='全部'||x.t==curType)&&(!wrongOnly.checked||st.w[x.id]));
 if(shuf.checked)list.sort(()=>Math.random()-.5);idx=0;render()}
function setType(t){curType=t;drawTypes();build()}
function drawTypes(){document.getElementById('types').innerHTML=types.map(t=>`<button class="${t==curType?'on':''}" onclick="setType('${t}')">${t}</button>`).join('')}
function letters(x){return x.a.replace(/[^A-Z]/g,'').split('').filter(l=>l.charCodeAt(0)-65<x.o.length)}
function render(){sel=new Set();answered=false;
 const d=Object.keys(st.done).length,w=Object.keys(st.w).length;
 stat.textContent=`共 ${Q.length} 题，已做 ${d} 题，错题本 ${w} 题`;
 const el=document.getElementById('q');if(!list.length){el.innerHTML='这里没有题目。';return}
 const x=list[idx];let h=`<div class="muted">${x.t} · 第 ${idx+1}/${list.length} 题</div><h3>${x.q}</h3>`;
 if(x.t=='单选题'||x.t=='多选题')h+=x.o.map((o,i)=>`<div class="opt" id="o${i}" onclick="pick(${i})">${String.fromCharCode(65+i)}. ${o}</div>`).join('');
 else if(x.t=='判断题')h+=['√','×'].map((o,i)=>`<div class="opt" id="o${i}" onclick="pick(${i})">${o=='√'?'正确 √':'错误 ×'}</div>`).join('');
 else h+=`<textarea id="inp" rows="5" placeholder="可以先写下你的答案，再查看参考答案"></textarea>`;
 h+=`<div id="res"></div><div style="margin-top:12px"><button class="sec" onclick="go(-1)">上一题</button><button onclick="submit()">${(x.t=='简答题'||x.t=='填空题')?'看答案':'提交'}</button><button class="sec" onclick="go(1)">下一题</button></div>`;
 el.innerHTML=h;const i=document.getElementById('inp');}
function pick(i){if(answered)return;const x=list[idx];if(x.t=='多选题'){sel.has(i)?sel.delete(i):sel.add(i)}else{sel=new Set([i])}
 document.querySelectorAll('.opt').forEach((e,j)=>e.classList.toggle('sel',sel.has(j)));if(x.t!='多选题')submit()}
function mark(x,ok){st.done[x.id]=1;if(ok)delete st.w[x.id];else st.w[x.id]=1;save()}
function submit(){if(answered){go(1);return}const x=list[idx],res=document.getElementById('res');let ok,ans;
 if(x.t=='单选题'||x.t=='多选题'){if(!sel.size)return;const c=letters(x);ans=c.join('');
  ok=c.length==sel.size&&c.every(l=>sel.has(l.charCodeAt(0)-65));x.o.forEach((_,j)=>{const e=document.getElementById('o'+j),r=c.includes(String.fromCharCode(65+j));if(r)e.classList.add('ok');else if(sel.has(j))e.classList.add('bad')})}
 else if(x.t=='判断题'){if(!sel.size)return;ans=x.a;const c=x.a.includes('√')?0:1;ok=sel.has(c);document.getElementById('o'+c).classList.add('ok');if(!ok)document.getElementById('o'+(1-c)).classList.add('bad')}
 else{answered=true;res.innerHTML=`<div class="res n">参考答案：\n${x.a}</div><button onclick="mark(list[idx],true);go(1)">我答对了</button><button class="sec" onclick="mark(list[idx],false);go(1)">没答好，加入错题本</button>`;return}
 answered=true;mark(x,ok);res.innerHTML=`<div class="res ${ok?'g':'r'}">${ok?'✅ 回答正确':'❌ 回答错误'}，正确答案：${ans}</div>`}
function go(d){if(!list.length)return;idx=(idx+d+list.length)%list.length;render()}
function resetAll(){if(confirm('清空做题记录和错题本？')){st={w:{},done:{}};save();build()}}
shuf.onchange=build;wrongOnly.onchange=build;drawTypes();build();
</script></body></html>
